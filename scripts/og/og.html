<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<title>og</title>
		<style>
			@font-face {
				font-family: 'Geist';
				src: url('../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2')
					format('woff2');
				font-weight: 100 900;
			}
			@font-face {
				font-family: 'Geist Mono';
				src: url('../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2')
					format('woff2');
				font-weight: 100 900;
			}
			@font-face {
				font-family: 'Instrument Serif';
				font-style: italic;
				src: url('../../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2')
					format('woff2');
			}

			:root {
				--fondo: #060709;
				--superficie: #0b0c0f;
				--borde: #1d1f26;
				--borde-fuerte: #2c2f38;
				--tinta: #f4f5f7;
				--tinta-suave: #9aa0ac;
				--tinta-tenue: #5d6370;
				--acento-300: #ddff85;
				--acento-400: #c8f550;
				--cian-400: #4fe3d0;
			}

			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html,
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
				background: var(--fondo);
			}

			.lienzo {
				position: relative;
				width: 1200px;
				height: 630px;
				overflow: hidden;
				font-family: 'Geist', sans-serif;
				color: var(--tinta);
				background: var(--fondo);
				-webkit-font-smoothing: antialiased;
			}

			.reticula {
				position: absolute;
				inset: 0;
				background-image: radial-gradient(var(--borde-fuerte) 1px, transparent 1px);
				background-size: 24px 24px;
				opacity: 0.55;
				-webkit-mask: radial-gradient(ellipse 75% 85% at 72% 45%, #000 20%, transparent 80%);
			}

			.halo {
				position: absolute;
				border-radius: 50%;
				filter: blur(90px);
			}
			.halo.a {
				width: 520px;
				height: 420px;
				right: 40px;
				top: 90px;
				background: color-mix(in oklab, var(--acento-400) 16%, transparent);
			}
			.halo.b {
				width: 360px;
				height: 300px;
				left: -120px;
				bottom: -160px;
				background: color-mix(in oklab, var(--cian-400) 10%, transparent);
			}

			.contenido {
				position: absolute;
				left: 80px;
				top: 78px;
				width: 640px;
			}

			.pastilla {
				display: inline-flex;
				align-items: center;
				gap: 12px;
				padding: 9px 20px 9px 14px;
				border: 1px solid var(--borde);
				border-radius: 999px;
				background: color-mix(in oklab, var(--superficie) 85%, transparent);
				font-size: 19px;
				color: var(--tinta-suave);
			}
			.punto {
				width: 10px;
				height: 10px;
				border-radius: 50%;
				background: var(--acento-400);
				box-shadow: 0 0 0 5px color-mix(in oklab, var(--acento-400) 18%, transparent);
			}

			h1 {
				margin-top: 34px;
				font-size: 116px;
				line-height: 0.92;
				font-weight: 600;
				letter-spacing: -0.055em;
			}
			h1 span.tinta {
				display: block;
				padding-bottom: 6px;
				background: linear-gradient(180deg, #fff 0%, #fff 40%, var(--tinta-tenue) 140%);
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
			}
			h1 .final {
				color: var(--acento-400);
			}

			.subtitulo {
				margin-top: 26px;
				font-size: 31px;
				line-height: 1.25;
				letter-spacing: -0.02em;
				color: var(--tinta-suave);
			}
			.serif {
				font-family: 'Instrument Serif', serif;
				font-style: italic;
				font-size: 1.18em;
				letter-spacing: -0.01em;
				background: linear-gradient(
					100deg,
					var(--acento-300) 0%,
					var(--acento-400) 35%,
					var(--cian-400) 100%
				);
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
				padding-right: 1px;
			}

			.pie {
				position: absolute;
				left: 80px;
				right: 80px;
				bottom: 52px;
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding-top: 26px;
				border-top: 1px solid var(--borde);
				font-family: 'Geist Mono', monospace;
				font-size: 19px;
				color: var(--tinta-tenue);
			}
			.pie .ubicacion {
				display: flex;
				align-items: center;
				gap: 10px;
			}
			.pie .dominio {
				color: var(--acento-400);
			}

			/* Ventana del flujo */
			.ventana {
				position: absolute;
				right: 64px;
				top: 92px;
				width: 380px;
				border: 1px solid color-mix(in oklab, var(--borde-fuerte) 80%, transparent);
				border-radius: 22px;
				background: color-mix(in oklab, var(--superficie) 90%, transparent);
				box-shadow:
					inset 0 1px 0 0 rgb(255 255 255 / 0.06),
					0 30px 60px rgb(0 0 0 / 0.5);
				overflow: hidden;
			}
			.barra {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 13px 16px;
				border-bottom: 1px solid var(--borde);
				font-family: 'Geist Mono', monospace;
				font-size: 12px;
				color: var(--tinta-tenue);
			}
			.semaforo {
				display: flex;
				gap: 6px;
			}
			.semaforo i {
				width: 10px;
				height: 10px;
				border-radius: 50%;
				opacity: 0.8;
			}
			.activo {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				padding: 3px 9px;
				border-radius: 999px;
				background: color-mix(in oklab, var(--acento-400) 10%, transparent);
				color: var(--acento-300);
				font-size: 11px;
			}
			.activo b {
				width: 6px;
				height: 6px;
				border-radius: 50%;
				background: var(--acento-400);
			}
			.ventana .reticula-v {
				background-image: radial-gradient(var(--borde-fuerte) 1px, transparent 1px);
				background-size: 20px 20px;
			}
			.ventana svg {
				display: block;
				width: 100%;
				height: auto;
			}
		</style>
	</head>
