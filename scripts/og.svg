<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2a2a31" fill-opacity="0.55" />
    </pattern>

    <filter id="blurLg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
    <filter id="blurMd" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="46" />
    </filter>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f4f5" />
      <stop offset="58%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#8b8b93" />
    </linearGradient>

    <linearGradient id="fadeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="48%" stop-color="#000000" />
      <stop offset="78%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <mask id="fadeMask">
      <rect width="1200" height="630" fill="url(#fadeGrad)" />
    </mask>
  </defs>

  <!-- fondo -->
  <rect width="1200" height="630" fill="#08080a" />

  <!-- halos de acento, muy tenues -->
  <circle cx="60" cy="70" r="320" fill="#b8934f" opacity="0.12" filter="url(#blurLg)" />
  <circle cx="1160" cy="560" r="260" fill="#93733c" opacity="0.10" filter="url(#blurMd)" />

  <!-- grano -->
  <rect width="1200" height="630" fill="url(#dots)" />

  <!-- marco -->
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#232329" stroke-width="1" />

  <!-- esquinas estilo visor, acento sutil -->
  <g stroke="#93733c" stroke-width="2" opacity="0.55" fill="none">
    <path d="M40 68 V40 H68" />
    <path d="M1132 40 H1160 V68" />
    <path d="M1160 562 V590 H1132" />
    <path d="M68 590 H40 V562" />
  </g>

  <!-- grafo decorativo, eco del canvas de flujos n8n -->
  <g mask="url(#fadeMask)" opacity="0.9">
    <g stroke="#93733c" stroke-width="1.5" fill="none" opacity="0.65">
      <path d="M878 140 C 920 140, 940 190, 980 230" />
      <path d="M980 230 C 940 270, 920 300, 890 340" />
      <path d="M890 340 C 940 360, 990 380, 1030 400" />
      <path d="M980 230 C 1020 270, 1040 330, 1030 400" />
    </g>
    <g fill="#0e0e11" stroke="#34343c" stroke-width="1.3">
      <rect x="822" y="121" width="56" height="38" rx="9" />
      <rect x="952" y="211" width="56" height="38" rx="9" />
      <rect x="862" y="321" width="56" height="38" rx="9" />
      <rect x="1002" y="381" width="56" height="38" rx="9" />
    </g>
    <g fill="#b8934f">
      <circle cx="850" cy="140" r="3" />
      <circle cx="980" cy="230" r="3" />
      <circle cx="890" cy="340" r="3" />
      <circle cx="1030" cy="400" r="3" />
    </g>
  </g>

  <!-- ceja: rol -->
  <line x1="80" y1="147" x2="112" y2="147" stroke="#93733c" stroke-width="1.5" />
  <text x="128" y="154" font-family="Inter" font-size="22" letter-spacing="3.5" fill="#cbab6b">DESARROLLADOR DE SOFTWARE</text>

  <!-- nombre -->
  <text x="76" y="298" font-family="Crimson Text" font-weight="700" font-size="118" fill="url(#nameGrad)">John Mendoza</text>

  <!-- subtitulo -->
  <text x="80" y="360" font-family="Inter" font-size="28" fill="#a1a1aa">Frontend con Vue y SvelteKit &#183; Automatizaci&#243;n con n8n e IA</text>

  <!-- divisor -->
  <line x1="80" y1="500" x2="1120" y2="500" stroke="#232329" stroke-width="1" />

  <!-- pie -->
  <circle cx="84" cy="551" r="4.5" fill="none" stroke="#6b6b75" stroke-width="1.5" />
  <circle cx="84" cy="551" r="1.4" fill="#6b6b75" />
  <text x="100" y="558" font-family="Inter" font-size="22" fill="#a1a1aa">Guayaquil, Ecuador</text>

  <text x="1120" y="558" text-anchor="end" font-family="Inter" font-size="20" letter-spacing="0.5" fill="#93733c">SvelteKit &#183; Vue &#183; n8n &#183; IA</text>
</svg>
