server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# adapter-static precomprime a .gz y .br en tiempo de build.
	gzip_static on;

	# Los assets de Vite llevan hash en el nombre: cachean para siempre.
	location /_app/immutable/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		access_log off;
	}

	# El HTML se revalida siempre para que un despliegue se vea al instante.
	# Fotogramas del fondo: muchos archivos sin hash que casi nunca cambian. Si se
	# regeneran, conviene renombrar la carpeta para invalidar esta caché.
	location /secuencia/ {
		expires 30d;
		add_header Cache-Control "public";
		access_log off;
	}

	location / {
		add_header Cache-Control "public, max-age=0, must-revalidate";
		try_files $uri $uri.html $uri/index.html =404;
	}

	error_page 404 /404.html;
}
